# Security headers mirrored from vercel.json so the Docker image matches the
# deployed posture. `include`d into every location block because an `add_header`
# in a location discards headers inherited from the server block — keeping these
# here and including them everywhere avoids that footgun.
#
# `always` sends them on error responses (404, etc.) too, matching Vercel.
#
# Note: Strict-Transport-Security is inert here — this container serves plain
# HTTP, and browsers ignore HSTS received over non-HTTPS. It's kept for parity
# with production (where TLS is terminated by Vercel).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), midi=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://storage.googleapis.com; connect-src 'self' https://storage.googleapis.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
