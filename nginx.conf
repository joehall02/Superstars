server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	# Fingerprinted build assets — the filename changes whenever the content
	# does, so they can be cached indefinitely.
	location /assets/ {
		include /etc/nginx/snippets/security-headers.conf;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# Data and config JSON keep a stable path across builds, so revalidate to
	# avoid serving stale scores from a rebuilt image.
	location ~* \.json$ {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "no-cache";
	}

	# SPA fallback — client-side routes (/rankings, /games/:id, …) all resolve
	# to the app shell.
	location / {
		include /etc/nginx/snippets/security-headers.conf;
		try_files $uri $uri/ /index.html;
		add_header Cache-Control "no-cache";
	}
}
